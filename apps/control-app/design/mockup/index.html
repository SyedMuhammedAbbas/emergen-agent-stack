<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Stack: design preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#fff; --surface-2:#F5F7F9; --line:#D8DEE5; --line-2:#E6EAEE;
  --ink:#17212B; --ink-2:#47556A; --ink-3:#6B7888; --on-ink:#fff;
  --clay:#D97757; --focus:#2F5BEA;
  --ok:#0B8A7B; --warn:#A8670A; --fail:#CC3B33; --off:#8793A1;
  --ok-bg:#E1F3F0; --warn-bg:#FBEFD8; --fail-bg:#FBE4E2; --off-bg:#EEF1F4;
  --eng:#4C8DF6; --ops:#3B9C5F; --brand:#E0609A; --free:#F5A524;
  --sans:"IBM Plex Sans","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.05);
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1A242E; --line:#27333F; --line-2:#202B36;
  --ink:#E7ECF1; --ink-2:#AEBBC8; --ink-3:#8190A0; --on-ink:#0E141A;
  --focus:#7C9BFF; --ok:#2BC4AE; --warn:#E3AE45; --fail:#F27068; --off:#7E8B99;
  --ok-bg:#12332F; --warn-bg:#3A2F15; --fail-bg:#3C1E1D; --off-bg:#1E2833;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1A242E; --line:#27333F; --line-2:#202B36;
  --ink:#E7ECF1; --ink-2:#AEBBC8; --ink-3:#8190A0; --on-ink:#0E141A;
  --focus:#7C9BFF; --ok:#2BC4AE; --warn:#E3AE45; --fail:#F27068; --off:#7E8B99;
  --ok-bg:#12332F; --warn-bg:#3A2F15; --fail-bg:#3C1E1D; --off-bg:#1E2833; --shadow:0 1px 2px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);overflow-wrap:anywhere}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:600;letter-spacing:.01em}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
.nav .ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;font:500 11px var(--mono);padding:1px 7px;border-radius:99px;background:var(--fail-bg);color:var(--fail)}
.nav a[aria-current="page"] .badge{background:var(--on-ink);color:var(--ink)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px;font-size:12px;color:var(--ink-3)}
.main{padding:28px clamp(16px,3vw,40px) 64px;max-width:1180px;width:100%}
.topline{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:6px;color:var(--ink-3);font-size:13px}
h1{font:600 clamp(24px,3.4vw,34px)/1.18 var(--sans);letter-spacing:-.015em;margin:4px 0 4px;max-width:40ch;text-wrap:balance}
h1 a{color:var(--ink);text-decoration-color:var(--clay);text-decoration-thickness:3px;text-underline-offset:5px}
h2{font:600 13px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.sub{color:var(--ink-2);margin:0 0 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 a{font:500 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-2)}

/* status lamps: shape + word, never colour alone */
.lamp{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.lamp i{width:11px;height:11px;flex:none;display:inline-block;background:currentColor}
.lamp.ok{color:var(--ok)} .lamp.ok i{border-radius:50%}
.lamp.warn{color:var(--warn)} .lamp.warn i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.lamp.fail{color:var(--fail)} .lamp.fail i{border-radius:2px}
.lamp.idle{color:var(--ink-3)} .lamp.idle i{background:none;border:2px solid currentColor;border-radius:50%}
.lamp.off{color:var(--off)} .lamp.off i{height:3px;border-radius:2px;margin:4px 0}
.lamp b{font-weight:500;color:var(--ink)}

/* services strip */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;min-width:0}
.tile:hover{border-color:var(--ink-3)}
.tile .n{font-weight:600}
.tile .d{font-size:12.5px;color:var(--ink-3)}
.tile.is-fail{border-color:var(--fail);background:var(--fail-bg)}
.tile.is-warn{border-color:var(--warn)}

/* needs you */
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.need li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-2)}
.need li:first-child{border-top:0;padding-top:0}
.need p{margin:0}.need .why{color:var(--ink-3);font-size:13.5px}
.empty{color:var(--ink-2);display:flex;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.danger{color:var(--fail);border-color:var(--fail)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--off-bg);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.fail{background:var(--fail-bg);color:var(--fail)}

/* spend */
.big{font:500 clamp(30px,4vw,42px)/1 var(--mono);letter-spacing:-.02em}
.of{color:var(--ink-3);font:400 15px var(--mono)}
.meter{height:8px;border-radius:99px;background:var(--off-bg);position:relative;margin:14px 0 6px;overflow:visible}
.meter>span{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter>em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}

/* crew */
.crew{display:flex;flex-wrap:wrap;gap:18px 26px}
.dept{min-width:0}
.dept h3{margin:0 0 8px;font:600 12.5px var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dept h3:before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.crabs{display:flex;flex-wrap:wrap;gap:4px 6px}
.crabbtn{background:none;border:1px solid transparent;border-radius:8px;padding:2px 2px 0;line-height:0}
.crabbtn:hover{border-color:var(--line);background:var(--surface-2)}
.crabbtn svg{width:42px;height:39px;overflow:visible}

/* rows (services, team, activity) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:0}
.row .t{font-weight:600}.row .s{font-size:13px;color:var(--ink-3)}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row.expandable{cursor:default}
.drawer{padding:0 18px 16px;border-top:0}
pre.log{margin:0;padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);font:400 12.5px/1.55 var(--mono);color:var(--ink-2);white-space:pre-wrap;overflow-x:auto}
.teamrow{grid-template-columns:48px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.3fr) auto}
.teamrow svg{width:42px;height:39px;overflow:visible}
button.rowbtn{all:unset;display:contents}
.deptbar{border-left:4px solid var(--c)}
.sect{padding:14px 18px 8px;font:600 12.5px var(--sans);color:var(--ink-2);background:var(--surface-2);border-top:1px solid var(--line-2);display:flex;gap:8px;align-items:center}
.sect:first-child{border-top:0}
.sect:before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}

/* side panel + dialog */
.panel{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);padding:22px;overflow:auto;transform:translateX(102%);transition:transform .22s ease;z-index:30}
.panel.open{transform:none}
.panel h3{margin:0 0 2px;font-size:20px}
.diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;font:400 12.5px/1.55 var(--mono);margin:8px 0 16px}
.diff div{padding:4px 12px;white-space:pre-wrap}
.diff .rm{background:var(--fail-bg);color:var(--fail)} .diff .ad{background:var(--ok-bg);color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:12px;padding:22px;max-width:min(460px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,16,22,.5)}
dialog h3{margin:0 0 8px}dialog p{margin:0 0 18px;color:var(--ink-2)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}

/* design-preview control (not part of the product) */
.dp{position:fixed;right:14px;bottom:14px;z-index:40;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 28px)}
.dp select,.dp button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:3px 8px;font:inherit}
.dp select option{color:#000}
.sample{font-size:12px;color:var(--ink-3)}

/* cost chart */
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:6px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column-reverse;gap:1px;height:100%}
.bars i{display:block;border-radius:2px 2px 0 0}
.bars .sub-i{background:repeating-linear-gradient(135deg,var(--ink-3) 0 2px,transparent 2px 5px);opacity:.7}
.bars .api-i{background:var(--clay)}
.axis{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--ink-3);margin-top:4px}

/* mobile bottom bar */
.tabs{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}.run .it{animation:wob 1s steps(1) infinite}
.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}@keyframes wob{50%{transform:translateY(-2px)}}
.live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.3}}

/* breakpoints last, so they win */
@media (max-width:1100px){
  .app{grid-template-columns:68px minmax(0,1fr)}
  .rail{padding:16px 8px;align-items:center}
  .brand span,.nav span,.rail-foot{display:none}
  .nav a{justify-content:center;padding:10px}
  .nav .badge{position:absolute;margin:-18px 0 0 18px;padding:0 5px}
  .nav a{position:relative}
  .g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding:18px 16px 96px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
  .tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11.5px;text-decoration:none;color:var(--ink-3);background:none;border:0}
  .tabs [aria-current="page"]{color:var(--ink);font-weight:600}
  .tabs .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .row,.teamrow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 14px}
  .row>:nth-child(3){grid-column:1 / -1}
  .teamrow>:nth-child(3),.teamrow>:nth-child(4){grid-column:2 / -1;grid-row:auto}
  .teamrow{grid-template-columns:48px minmax(0,1fr)}
  .teamrow>:last-child{grid-column:2}
  .row .acts{justify-content:flex-start}
  .dp{bottom:74px}
  .need li{grid-template-columns:auto minmax(0,1fr)}.need li>:last-child{grid-column:2}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><svg width="30" height="28" viewBox="0 0 30 28" id="logo" aria-hidden="true"></svg><span>Agent Stack</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot"><span class="mono" id="railclock"></span><button class="btn small" id="theme" type="button">Dark mode</button></div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Details" aria-hidden="true"></aside>
<dialog id="dlg"></dialog>
<div class="dp" role="group" aria-label="Design preview controls">
  <span>Design preview:</span>
  <label class="sr" for="state">State</label>
  <select id="state"><option value="ok">All running</option><option value="svc">A service stopped</option><option value="wsl">WSL is down</option></select>
  <span class="sample">sample data</span>
</div>

<script>
/* ===== the crab: ported from mods/paperclip-crew/hooks/crab.ts so the app and the Claude mod look the same ===== */
const CLAY='#D97757',INK='#1F1E1D',GOLD='#F5C542',GREY='#8E929A',DARK='#3A3A3C',PAPER='#F4F3EE';
const ACCENT={engineering:'#4C8DF6',operations:'#3B9C5F',branding:'#E0609A',freelance:'#F5A524'};
const PROFILES={manager:['engineering','cap','clipboard'],cto:['engineering','crown','none'],'frontend engineer':['engineering','headphones','palette'],'backend engineer':['engineering','headphones','none'],'devops engineer':['engineering','hardhat','wrench'],'secops engineer':['engineering','hardhat','shield'],qa:['engineering','glasses','magnifier'],'ux reviewer':['engineering','beret','magnifier'],docs:['engineering','glasses','pen'],estimator:['engineering','cap','calc'],'chief of staff':['operations','crown','clipboard'],timekeeper:['operations','cap','clock'],watchdog:['operations','hardhat','magnifier'],'brand lead':['branding','crown','palette'],designer:['branding','beret','palette'],'video generator':['branding','cap','camera'],'orrisian content':['branding','glasses','pen'],'upwork scout':['freelance','cap','briefcase']};
const HATS={crown:(f,a)=>{f(10,8,10,2,GOLD);f(10,6,2,2,GOLD);f(14,5,2,3,GOLD);f(18,6,2,2,GOLD);f(14,8,2,1,a)},hardhat:f=>{f(9,6,12,3,GOLD);f(8,9,14,1,'#C99A1E');f(14,5,2,1,GOLD)},beret:(f,a)=>{f(8,7,13,3,a);f(10,6,8,1,a);f(14,5,2,1,a)},cap:(f,a)=>{f(9,7,12,3,a);f(20,9,5,2,a)},headphones:(f,a)=>{f(8,7,14,1,DARK);f(7,8,1,5,DARK);f(22,8,1,5,DARK);f(6,11,3,4,a);f(21,11,3,4,a)},glasses:f=>{f(8,11,4,1,DARK);f(8,14,4,1,DARK);f(8,12,1,2,DARK);f(11,12,1,2,DARK);f(18,11,4,1,DARK);f(18,14,4,1,DARK);f(18,12,1,2,DARK);f(21,12,1,2,DARK);f(12,12,6,1,DARK)},none:()=>{}};
const PROPS={clipboard:f=>{f(24,8,5,7,'#C9A66B','it');f(25,7,3,1,GREY,'it');f(25,10,3,1,PAPER,'it');f(25,12,3,1,PAPER,'it')},wrench:f=>{f(24,9,1,1,GREY,'it');f(26,9,1,1,GREY,'it');f(24,10,3,1,GREY,'it');f(25,11,1,5,GREY,'it')},magnifier:f=>{f(24,8,3,1,DARK,'it');f(23,9,1,3,DARK,'it');f(27,9,1,3,DARK,'it');f(24,12,3,1,DARK,'it');f(24,9,3,3,'rgba(169,214,245,.7)','it');f(27,13,1,3,'#7A4A26','it')},pen:(f,a)=>{f(26,7,2,9,a,'it');f(26,16,2,1,INK,'it');f(26,6,2,1,GOLD,'it')},shield:(f,a)=>{f(23,8,6,6,GREY,'it');f(24,9,4,4,a,'it');f(25,14,2,1,GREY,'it')},camera:f=>{f(23,9,7,5,DARK,'it');f(24,8,3,1,DARK,'it');f(25,10,3,3,'rgba(169,214,245,.8)','it')},palette:(f,a)=>{f(23,9,7,6,'#E8D2A8','it');f(24,10,1,1,'#D0453F','it');f(26,10,1,1,'#3B7DD8','it');f(28,11,1,1,'#3B9C5F','it');f(25,12,1,1,a,'it')},briefcase:f=>{f(23,11,7,5,'#7A4A26','it');f(25,10,3,1,'#7A4A26','it');f(26,13,1,1,GOLD,'it')},clock:f=>{f(24,9,5,5,PAPER,'it');f(26,10,1,3,INK,'it');f(26,12,2,1,INK,'it')},calc:f=>{f(24,8,5,8,DARK,'it');f(25,9,3,2,'rgba(169,214,245,.8)','it');f(25,12,1,1,PAPER,'it');f(27,12,1,1,PAPER,'it');f(25,14,1,1,PAPER,'it');f(27,14,1,1,PAPER,'it')},none:()=>{}};
function crab(name,mood){
  const [dept,hat,prop]=PROFILES[name.toLowerCase()]||['engineering','none','none'],a=ACCENT[dept],g=new Map([['bd',[]]]);
  const f=(x,y,w,h,c,cls='bd')=>{if(!g.has(cls))g.set(cls,[]);g.get(cls).push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`)};
  const err=mood==='error';
  f(7,10,16,12,CLAY);f(3,14,4,4,CLAY);f(23,prop==='none'?14:10,4,4,CLAY,'it');f(9,12,2,2,err?'#D0453F':INK);f(19,12,2,2,err?'#D0453F':INK);
  f(7,22,2,4,CLAY,'la');f(17,22,2,4,CLAY,'la');f(11,22,2,4,CLAY,'lb');f(21,22,2,4,CLAY,'lb');
  (HATS[hat]||HATS.none)(f,a);(PROPS[prop]||PROPS.none)(f,a);
  if(err){f(1,0,2,4,'#D0453F');f(1,5,2,2,'#D0453F')}
  if(mood==='paused'){f(1,0,4,1,GOLD);f(3,1,1,1,GOLD);f(2,2,1,1,GOLD);f(1,3,4,1,GOLD)}

  if(a==='start-wsl') return confirmDlg('Start WSL?','This starts the Ubuntu distro and the services in it. It takes about 20 seconds.','Start WSL',false,()=>{STATE='ok';document.getElementById('state').value='ok';paint();flash('Started (preview only)')});
  if(a==='take-template') return confirmDlg('Use the template for Estimator?','Its instructions are replaced with the template version. Your version is saved in the journal, and “stack rollback” restores it.','Use the template',false,()=>{togglePanel(false);flash('Updated (preview only)')});
  if(a==='doctor'){document.getElementById('doc').innerHTML=['Paperclip answers on Windows|ok','Keepalive task is running|ok','C: has 88 GB free|ok','Claude is logged in (WSL)|ok','Symlinks work from Node (Developer Mode)|ok','Hermes bridge is not set up|warn'].map(x=>{const [m,k]=x.split('|');return `<div style="margin:6px 0">${lamp(k,m)}</div>`}).join('')}
});
function confirmMore(){const d=document.getElementById('dlg');d.innerHTML=`<h3>More</h3><p style="display:flex;flex-direction:column;gap:8px"><a class="btn" href="#/activity" data-ok>Activity</a><a class="btn" href="#/models" data-ok>Models</a></p><div class="acts"><button class="btn" type="button" data-x>Close</button></div>`;d.querySelectorAll('[data-ok],[data-x]').forEach(b=>b.onclick=()=>d.close());d.showModal()}
function flash(m){const n=document.createElement('div');n.textContent=m;n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:99px;z-index:60;font-size:13.5px';document.body.append(n);setTimeout(()=>n.remove(),2200)}
document.getElementById('scrim').onclick=()=>togglePanel(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')togglePanel(false)});
document.getElementById('state').onchange=e=>{STATE=e.target.value;paint()};
function applyTheme(){document.documentElement.dataset.theme=THEME||'';document.getElementById('theme').textContent=(THEME==='dark'||(!THEME&&matchMedia('(prefers-color-scheme:dark)').matches))?'Light mode':'Dark mode'}
document.getElementById('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark'||(!THEME&&matchMedia('(prefers-color-scheme:dark)').matches);THEME=dark?'light':'dark';try{localStorage.setItem('theme',THEME)}catch{}applyTheme()};
addEventListener('hashchange',()=>{togglePanel(false);paint();scrollTo(0,0)});
document.getElementById('railclock').textContent='v0.1 preview';
applyTheme();paint();
</script>
</body>
</html>
